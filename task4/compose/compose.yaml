name: lab1-task4

services:
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8085}:80"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - simple_python_app
    networks:
      - frontend-net

  simple_python_app:
    image: ${APP_IMAGE:-lab1-task4-api:latest}
    build:
      context: ../../task3/simple_python_app
      dockerfile: Dockerfile.v6
    environment:
      API_DB_HOST: db
      API_DB_NAME: api
      API_DB_USER: apiuser
      API_DB_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  db:
    image: postgres:16.2-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: api
      POSTGRES_USER: apiuser
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiuser -d api"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  frontend-net:
  backend-net:

volumes:
  dbdata:
